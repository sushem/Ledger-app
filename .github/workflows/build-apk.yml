name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select APK build type"
        required: true
        type: choice
        options:
          - debug
          - release
          - both
        default: both

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: gradle assembleDebug

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: gradle assembleRelease

      - name: Rename debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/ExpenseTracker-debug.apk

      - name: Rename release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/ExpenseTracker.apk
      
      - name: Upload debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v7
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/ExpenseTracker-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v7
        with:
          name: ExpenseTracker-apk
          path: app/build/outputs/apk/release/ExpenseTracker.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/download-artifact@v7
        with:
          name: ExpenseTracker-debug-apk
          path: apks

      - name: Download release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/download-artifact@v7
        with:
          name: ExpenseTracker-apk
          path: apks

      - name: Verify downloaded files
        run: |
          echo "Downloaded APKs:"
          find apks -type f -name "*.apk" -ls

      - name: Create GitHub Release - Debug
        if: ${{ inputs.build_type == 'debug' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}.

            Build type: `debug`

            - `ExpenseTracker-debug.apk` — debuggable, for testing
          files: |
            apks/ExpenseTracker-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release - Release
        if: ${{ inputs.build_type == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}.

            Build type: `release`

            - `ExpenseTracker.apk` — release build
          files: |
            apks/ExpenseTracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release - Both
        if: ${{ inputs.build_type == 'both' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}.

            Build type: `both`

            - `ExpenseTracker-debug.apk` — debuggable, for testing
            - `ExpenseTracker.apk` — release build
          files: |
            apks/ExpenseTracker-debug.apk
            apks/ExpenseTracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}