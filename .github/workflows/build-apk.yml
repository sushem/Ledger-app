name: Build APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK
        run: gradle assembleRelease

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ExpenseTracker-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v7
        with:
          name: ExpenseTracker-debug-apk
          path: apks

      - name: Download release APK
        uses: actions/download-artifact@v7
        with:
          name: ExpenseTracker-apk
          path: apks
      
      - name: Rename APK
        run: |
            mv apks/app-release.apk apks/ExpenseTracker.apk 
            mv apks/app-debug.apk apks/ExpenseTracker-debug.apk

      - name: Verify release files
        run: |
          echo "Debug APK:"
          ls -lh apks/ExpenseTracker-debug.apk

          echo "Release APK:"
          ls -lh apks/ExpenseTracker.apk

      - name: Create GitHub Release with APKs attached
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}.
            - `ExpenseTracker-debug.apk` — debuggable, for testing
            - `ExpenseTracker.apk` — release build type
          files: |
            apks/ExpenseTracker-debug.apk
            apks/ExpenseTracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
