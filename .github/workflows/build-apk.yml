name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select APK build type"
        required: true
        type: choice
        options:
          - debug
          - release
          - both
        default: both

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: gradle assembleDebug

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: gradle assembleRelease

      - name: Rename debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/ExpenseTracker-debug.apk

      - name: Rename release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/ExpenseTracker.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/download-artifact@v7
        with:
          name: ExpenseTracker-debug-apk
          path: apks

      - name: Download release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/download-artifact@v7
        with:
          name: ExpenseTracker-apk
          path: apks
      

      - name: Verify debug files
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: |
          echo "Debug APK:"
          ls -lh apks/ExpenseTracker-debug.apk
      
      - name: Verify release files
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: |
          echo "Release APK:"
          ls -lh apks/ExpenseTracker.apk

      - name: Prepare release files
        run: |
          if [[ "${{ inputs.build_type }}" == "debug" ]]; then
            echo "RELEASE_FILES=apks/ExpenseTracker-debug.apk" >> "$GITHUB_ENV"
          elif [[ "${{ inputs.build_type }}" == "release" ]]; then
            echo "RELEASE_FILES=apks/ExpenseTracker.apk" >> "$GITHUB_ENV"
          else
            echo "RELEASE_FILES=apks/ExpenseTracker-debug.apk apks/ExpenseTracker.apk" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}.

            Build type: `${{ inputs.build_type }}`

            ${{ inputs.build_type == 'debug' && '- `ExpenseTracker-debug.apk` — debuggable, for testing' || '' }}
            ${{ inputs.build_type == 'release' && '- `ExpenseTracker.apk` — release build' || '' }}
            ${{ inputs.build_type == 'both' && '- `ExpenseTracker-debug.apk` — debuggable, for testing
            - `ExpenseTracker.apk` — release build' || '' }}
          files: ${{ env.RELEASE_FILES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}