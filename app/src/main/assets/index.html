<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Ledger</title>
<style>
  :root{
    --ink:#16241C; --panel:#1E3226; --panel2:#24392B; --paper:#EDE7D8;
    --faint:#93A091; --rule:rgba(237,231,216,0.10); --gold:#C9A227; --moss:#7FB69A; --rust:#C1614A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--paper);
    font-family:-apple-system,Roboto,"Segoe UI",Inter,sans-serif; overscroll-behavior:none;}
  .display{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  #app{padding-bottom:100px; min-height:100vh;}
  .eyebrow{font-size:11px; letter-spacing:.16em; color:var(--gold);}
  header{padding:24px 20px 6px; display:flex; justify-content:space-between; align-items:flex-start;}
  .icon-btn{background:var(--panel); border:1px solid var(--rule); border-radius:10px; width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;}
  .card{background:var(--panel); border:1px solid var(--rule); border-radius:16px; padding:20px;}
  .hero{margin:10px 20px 0;}
  .hero-top{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap;}
  .balance-num{font-size:32px; font-weight:600;}
  .spark{width:140px; height:50px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
  .stat{background:var(--panel2); border-radius:12px; padding:12px 14px;}
  .stat.income{border-left:3px solid var(--moss);}
  .stat.expense{border-left:3px solid var(--rust);}
  .stat-label{font-size:11px; letter-spacing:.08em; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .stat.income .stat-label{color:var(--moss);}
  .stat.expense .stat-label{color:var(--rust);}
  .stat-val{font-size:18px;}
  section{margin:20px 20px 0;}
  .section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .section-title{font-size:17px;}
  .toggle{display:flex; background:var(--panel); border-radius:8px; border:1px solid var(--rule); overflow:hidden;}
  .toggle button{padding:5px 12px; font-size:11.5px; letter-spacing:.04em; border:none; background:transparent;
    color:var(--faint); font-weight:600; text-transform:capitalize;}
  .toggle button.active{background:var(--gold); color:var(--ink);}
  .cat-row{padding:12px 18px; border-bottom:1px solid var(--rule);}
  .cat-row:last-child{border-bottom:none;}
  .cat-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .cat-bar{height:5px; background:var(--panel2); border-radius:3px; overflow:hidden;}
  .cat-fill{height:100%; border-radius:3px;}
  .list-card{border-radius:16px; max-height:340px; overflow-y:auto;}
  .tx-row{display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--rule);}
  .tx-row:last-child{border-bottom:none;}
  .tx-desc{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx-sub{font-size:11px; color:var(--faint); margin-top:2px;}
  .tx-amt.income{color:var(--moss);}
  .tx-amt.expense{color:var(--rust);}
  .del-btn{background:none; border:none; opacity:.55; padding:4px; font-size:14px; color:var(--paper);}
  .empty{padding:28px 18px; text-align:center; color:var(--faint); font-size:13px;}
  .fab{position:fixed; right:22px; bottom:22px; width:56px; height:56px; border-radius:50%;
    background:var(--gold); border:none; font-size:28px; color:var(--ink); box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:20;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:90px; background:var(--panel2); color:var(--paper);
    padding:8px 16px; border-radius:20px; font-size:12.5px; border:1px solid var(--rule); z-index:30; opacity:0; transition:opacity .2s;}
  .toast.show{opacity:1;}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center;
    z-index:40; opacity:0; pointer-events:none; transition:opacity .18s;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{background:var(--panel); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:22px 22px 30px;
    border:1px solid var(--rule); border-bottom:none; transform:translateY(20px); transition:transform .18s;
    max-height:85vh; overflow-y:auto;}
  .overlay.show .sheet{transform:translateY(0);}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .sheet-title{font-size:20px;}
  .close-btn{background:var(--panel2); border:none; border-radius:8px; width:30px; height:30px; color:var(--faint); font-size:15px;}
  .type-toggle{display:flex; background:var(--panel2); border-radius:10px; padding:4px; margin-bottom:16px;}
  .type-toggle button{flex:1; padding:9px 0; border-radius:8px; border:none; font-weight:600; font-size:13.5px; color:var(--faint); background:transparent;}
  .type-toggle button.active-expense{background:var(--rust); color:var(--ink);}
  .type-toggle button.active-income{background:var(--moss); color:var(--ink);}
  .field{margin-bottom:14px;}
  .field label{font-size:11.5px; color:var(--faint); margin-bottom:6px; display:block; letter-spacing:.04em;}
  input, select, textarea{width:100%; background:var(--panel2); border:1px solid var(--rule); border-radius:9px;
    padding:10px 12px; color:var(--paper); font-size:14px; outline:none; font-family:inherit;}
  textarea{resize:none;}
  .primary-btn{width:100%; padding:13px 0; border-radius:10px; border:none; background:var(--gold); color:var(--ink);
    font-weight:700; font-size:14.5px; margin-top:6px;}
  .err{color:var(--rust); font-size:12.5px; margin-bottom:10px;}
  .cat-manage-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .cat-manage-row span{font-size:13px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cat-manage-row input{width:90px; padding:7px 10px;}
  .icon-del{background:none; border:none; opacity:.55; flex-shrink:0; font-size:14px; color:var(--paper);}
  .type-label{font-size:10.5px; letter-spacing:.08em; margin:10px 0 6px; text-transform:uppercase;}
  .type-label.expense{color:var(--rust);}
  .type-label.income{color:var(--moss);}
  .add-cat-row{display:flex; gap:8px; margin-top:4px; margin-bottom:6px;}
  .add-cat-btn{background:var(--panel2); border:1px solid var(--rule); border-radius:9px; width:40px; color:var(--gold); font-size:16px; flex-shrink:0;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(237,231,216,0.15); border-radius:3px;}
  ::placeholder{color:var(--faint); opacity:.7;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------------- storage ---------------- */
const STORE_KEY = "ledgerData";
const DEFAULT_SETTINGS = {
  startingBalance: 20000,
  categories: {
    expense: ["Food","Gifts","Health/medical","Home","Transportation","Utilities","Investments","Other"],
    income: ["Paycheck","Bonus","Interest","Savings","Other"]
  },
  planned: { Food:2000, Gifts:0, "Health/medical":0, Home:15000, Transportation:500,
    Utilities:500, Investments:2000, Other:1000, Paycheck:23000, Bonus:0, Interest:0, Savings:0 }
};
const SEED_TX = [
  {id:"t1",type:"income",amount:30698,category:"Paycheck",description:"Monthly salary",date:isoDaysAgo(29)},
  {id:"t2",type:"expense",amount:15011,category:"Home",description:"Rent / society fee",date:isoDaysAgo(28)},
  {id:"t3",type:"expense",amount:2000,category:"Investments",description:"SIP transfer",date:isoDaysAgo(27)},
  {id:"t4",type:"expense",amount:671,category:"Food",description:"Groceries",date:isoDaysAgo(24)},
  {id:"t5",type:"expense",amount:500,category:"Transportation",description:"Fuel",date:isoDaysAgo(20)},
  {id:"t6",type:"expense",amount:130,category:"Utilities",description:"Internet bill",date:isoDaysAgo(15)},
  {id:"t7",type:"expense",amount:890,category:"Other",description:"Misc shopping",date:isoDaysAgo(8)}
];
function isoDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const fresh = { transactions: SEED_TX, settings: DEFAULT_SETTINGS };
  saveData(fresh);
  return fresh;
}
function saveData(data){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){ showToast("Couldn't save"); }
}

let data = loadData();
let catFilter = "expense";

/* ---------------- helpers ---------------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function fmt(n){ n = Number(n)||0; const sign = n<0 ? "-" : ""; return sign + "\u20B9" + Math.abs(n).toLocaleString("en-IN",{maximumFractionDigits:0}); }
function monthLabel(){ return new Date().toLocaleDateString("en-IN",{month:"long",year:"numeric"}); }
function esc(s){ const d=document.createElement("div"); d.innerText=s==null?"":s; return d.innerHTML; }

function computeStats(){
  const tx = data.transactions;
  const income = tx.filter(t=>t.type==="income").reduce((s,t)=>s+Number(t.amount),0);
  const expense = tx.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount),0);
  const balance = (data.settings.startingBalance||0) + income - expense;
  return {income, expense, balance};
}
function computeByCategory(){
  const tx = data.transactions.filter(t=>t.type===catFilter);
  const cats = data.settings.categories[catFilter] || [];
  return cats.map(c=>{
    const actual = tx.filter(t=>t.category===c).reduce((s,t)=>s+Number(t.amount),0);
    const planned = data.settings.planned[c] || 0;
    return {category:c, actual, planned};
  }).sort((a,b)=>b.actual-a.actual);
}
function computeTrend(){
  const tx = [...data.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let bal = data.settings.startingBalance||0;
  const points = [bal];
  tx.forEach(t=>{ bal += t.type==="income" ? Number(t.amount) : -Number(t.amount); points.push(bal); });
  return points;
}
function sparklineSVG(points, w, h, color){
  if(points.length<2) return `<svg width="${w}" height="${h}"></svg>`;
  const min = Math.min(...points), max = Math.max(...points);
  const range = (max-min)||1;
  const step = w/(points.length-1);
  const pts = points.map((p,i)=>`${(i*step).toFixed(1)},${(h - ((p-min)/range)*h).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ---------------- rendering ---------------- */
function render(){
  const stats = computeStats();
  const byCat = computeByCategory();
  const trend = computeTrend();
  const recent = [...data.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,12);

  document.getElementById("app").innerHTML = `
    <header>
      <div>
        <div class="eyebrow mono">MONTHLY LEDGER</div>
        <div class="display" style="font-size:26px; font-weight:600; margin-top:6px;">${esc(monthLabel())}</div>
      </div>
      <button class="icon-btn" onclick="openSettings()">&#9881;</button>
    </header>

    <div class="hero card">
      <div class="hero-top">
        <div>
          <div class="eyebrow" style="color:var(--faint); font-size:11px;">CURRENT BALANCE</div>
          <div class="balance-num mono" style="margin-top:6px;">${fmt(stats.balance)}</div>
        </div>
        <div class="spark">${sparklineSVG(trend,140,50,"var(--gold)")}</div>
      </div>
      <div class="stat-grid">
        <div class="stat income">
          <div class="stat-label">&#8593; INCOME</div>
          <div class="stat-val mono">${fmt(stats.income)}</div>
        </div>
        <div class="stat expense">
          <div class="stat-label">&#8595; EXPENSES</div>
          <div class="stat-val mono">${fmt(stats.expense)}</div>
        </div>
      </div>
    </div>

    <section>
      <div class="section-head">
        <div class="section-title display">By category</div>
        <div class="toggle">
          <button class="${catFilter==='expense'?'active':''}" onclick="setCatFilter('expense')">Expense</button>
          <button class="${catFilter==='income'?'active':''}" onclick="setCatFilter('income')">Income</button>
        </div>
      </div>
      <div class="card" style="padding:6px 18px;">
        ${byCat.length===0 ? `<div class="empty">No categories yet — add one in Settings.</div>` : byCat.map(row=>{
          const max = Math.max(row.planned, row.actual, 1);
          const pct = Math.min(100, (row.actual/max)*100);
          const over = row.planned>0 && row.actual>row.planned;
          const fillColor = over ? "var(--rust)" : (catFilter==="income" ? "var(--moss)" : "var(--gold)");
          return `<div class="cat-row">
            <div class="cat-top">
              <span>${esc(row.category)}</span>
              <span class="mono" style="color:${over?'var(--rust)':'var(--faint)'}">${fmt(row.actual)}${row.planned>0?` / ${fmt(row.planned)}`:""}</span>
            </div>
            <div class="cat-bar"><div class="cat-fill" style="width:${pct}%; background:${fillColor};"></div></div>
          </div>`;
        }).join("")}
      </div>
    </section>

    <section>
      <div class="section-title display" style="margin-bottom:10px;">Recent entries</div>
      <div class="card list-card" style="padding:0;">
        ${recent.length===0 ? `<div class="empty">No entries yet. Tap + to record your first income or expense.</div>` :
          recent.map(t=>`
          <div class="tx-row">
            <div style="min-width:0;">
              <div class="tx-desc">${esc(t.description || t.category)}</div>
              <div class="tx-sub">${esc(new Date(t.date).toLocaleDateString("en-IN",{day:"2-digit",month:"short"}))} &middot; ${esc(t.category)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
              <span class="tx-amt ${t.type} mono">${t.type==="income"?"+":"\u2212"}${fmt(t.amount).replace("-","")}</span>
              <button class="del-btn" onclick="removeTx('${t.id}')">&#128465;</button>
            </div>
          </div>`).join("")}
      </div>
    </section>

    <button class="fab" onclick="openAdd()">+</button>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="overlay"></div>
  `;
}

function setCatFilter(f){ catFilter = f; render(); }
function removeTx(id){ data.transactions = data.transactions.filter(t=>t.id!==id); saveData(data); render(); }
function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ---------------- add entry sheet ---------------- */
let addState = { type:"expense" };
function openAdd(){
  addState = { type:"expense" };
  const cats = data.settings.categories.expense;
  renderOverlay(`
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title display">New entry</div>
        <button class="close-btn" onclick="closeOverlay()">&times;</button>
      </div>
      <div class="type-toggle" id="typeToggle">
        <button id="btnExpense" class="active-expense" onclick="setAddType('expense')">Expense</button>
        <button id="btnIncome" onclick="setAddType('income')">Income</button>
      </div>
      <div class="field"><label>Category</label>
        <select id="addCategory">${cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Amount (&#8377;)</label>
        <input id="addAmount" type="number" inputmode="decimal" placeholder="0.00" />
      </div>
      <div class="field"><label>Description</label>
        <textarea id="addDesc" rows="2" placeholder="What was this for?"></textarea>
      </div>
      <div class="field"><label>Date</label>
        <input id="addDate" type="date" value="${new Date().toISOString().slice(0,10)}" />
      </div>
      <div class="err" id="addErr" style="display:none;"></div>
      <button class="primary-btn" onclick="submitAdd()">Save entry</button>
    </div>
  `);
}
function setAddType(type){
  addState.type = type;
  document.getElementById("btnExpense").className = type==="expense" ? "active-expense" : "";
  document.getElementById("btnIncome").className = type==="income" ? "active-income" : "";
  const cats = data.settings.categories[type] || [];
  document.getElementById("addCategory").innerHTML = cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
}
function submitAdd(){
  const amount = parseFloat(document.getElementById("addAmount").value);
  const category = document.getElementById("addCategory").value;
  const description = document.getElementById("addDesc").value.trim();
  const date = document.getElementById("addDate").value;
  const errEl = document.getElementById("addErr");
  if(!amount || amount<=0){ errEl.textContent="Enter an amount greater than 0"; errEl.style.display="block"; return; }
  if(!category){ errEl.textContent="Add a category first, in Settings"; errEl.style.display="block"; return; }
  data.transactions.unshift({ id:uid(), type:addState.type, amount, category, description, date });
  saveData(data);
  closeOverlay();
  render();
  showToast(addState.type==="income" ? "Income added" : "Expense added");
}

/* ---------------- settings sheet ---------------- */
let settingsDraft = null;
function openSettings(){
  settingsDraft = JSON.parse(JSON.stringify(data.settings));
  renderSettingsSheet();
}
function renderSettingsSheet(){
  const s = settingsDraft;
  const catBlock = ["expense","income"].map(type=>`
    <div class="type-label ${type}">${type}</div>
    ${s.categories[type].map(c=>`
      <div class="cat-manage-row">
        <span>${esc(c)}</span>
        <input type="number" value="${s.planned[c]||0}" onchange="updatePlanned('${esc(c).replace(/'/g,"\\'")}', this.value)" />
        <button class="icon-del" onclick="removeCategory('${type}','${esc(c).replace(/'/g,"\\'")}')">&#128465;</button>
      </div>
    `).join("")}
  `).join("");

  renderOverlay(`
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title display">Settings</div>
        <button class="close-btn" onclick="closeOverlay()">&times;</button>
      </div>
      <div class="field"><label>Starting balance (&#8377;)</label>
        <input id="stStartBal" type="number" value="${s.startingBalance}" onchange="settingsDraft.startingBalance=parseFloat(this.value)||0" />
      </div>
      <div class="eyebrow" style="color:var(--faint); margin:14px 0 8px; display:block;">CATEGORIES &amp; PLANNED BUDGETS</div>
      <div style="max-height:220px; overflow-y:auto; padding-right:4px;">${catBlock}</div>
      <div class="add-cat-row">
        <input id="newCatName" placeholder="New category name" style="flex:1;" />
        <select id="newCatType" style="width:100px;">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <button class="add-cat-btn" onclick="addCategory()">+</button>
      </div>
      <div class="err" id="catErr" style="display:none;"></div>
      <button class="primary-btn" onclick="submitSettings()">Save settings</button>
    </div>
  `);
}
function updatePlanned(cat, val){ settingsDraft.planned[cat] = parseFloat(val)||0; }
function removeCategory(type, name){
  settingsDraft.categories[type] = settingsDraft.categories[type].filter(c=>c!==name);
  renderSettingsSheet();
}
function addCategory(){
  const name = document.getElementById("newCatName").value.trim();
  const type = document.getElementById("newCatType").value;
  const errEl = document.getElementById("catErr");
  if(!name) return;
  if(settingsDraft.categories[type].some(c=>c.toLowerCase()===name.toLowerCase())){
    errEl.textContent = "That category already exists"; errEl.style.display="block"; return;
  }
  settingsDraft.categories[type].push(name);
  settingsDraft.planned[name] = 0;
  renderSettingsSheet();
}
function submitSettings(){
  data.settings = settingsDraft;
  saveData(data);
  closeOverlay();
  render();
}

/* ---------------- overlay plumbing ---------------- */
function renderOverlay(html){
  const ov = document.getElementById("overlay");
  ov.innerHTML = html;
  ov.onclick = (e)=>{ if(e.target===ov) closeOverlay(); };
  requestAnimationFrame(()=>ov.classList.add("show"));
}
function closeOverlay(){
  const ov = document.getElementById("overlay");
  ov.classList.remove("show");
  setTimeout(()=>{ ov.innerHTML=""; }, 180);
}

render();
</script>
</body>
</html>
